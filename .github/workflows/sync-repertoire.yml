name: Sync authorized repertoire

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

concurrency:
  group: repertoire-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run repertoire:sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit catalog changes
        run: |
          git config user.name "guitarstudio-bot"
          git config user.email "guitarstudio-bot@users.noreply.github.com"
          git add public/repertoire
          git diff --cached --quiet || git commit -m "chore: sync authorized repertoire"
          git push
